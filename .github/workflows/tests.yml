# Run the full offline test suite on every push/PR. The suite needs no external services,
# no API keys, and no Docker (live-LLM tests auto-skip); [ui] is required because the
# server/assistant/TUI tests import fastapi.
name: tests

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_merge_history_integrity.py scans every merge for the shape that
          # silently deleted two commits (and their guarding tests) from this repo TWICE — a merge
          # whose tree equals one parent's while another parent carries commits it lacks. Under the
          # default shallow fetch there is no history to scan and those tests skip cleanly, i.e. the
          # guard is present and inert, which is the worst of both.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: python -m pytest

  # A small second platform leg is deliberate: subprocess/path/locking behavior is materially
  # different on Windows, and Linux-only CI previously missed both a path assertion and a network
  # unit test that expanded into minutes of timeout retries on Windows.
  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: python -m pytest --splits 4 --group ${{ matrix.group }}

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - name: Build production UI
        run: npm run build
        working-directory: ui
      - name: Enforce bundle budgets
        run: npm run check:bundle
        working-directory: ui

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: python -m pip install build
      - run: python -m build
      - name: Prove the sdist builds a wheel without Node dependencies
        run: |
          mkdir clean-dist
          cp dist/*.tar.gz clean-dist/
          python -m pip wheel --no-deps --no-build-isolation clean-dist/*.tar.gz
