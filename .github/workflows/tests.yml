# Run the full offline test suite on every push/PR. The suite needs no external services,
# no API keys, and no Docker (live-LLM tests auto-skip); [ui] is required because the
# server/assistant/TUI tests import fastapi.
name: tests

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # FOUR SHARDS, not one process. This job used to run the whole suite in ONE `python -m pytest`
  # under `timeout-minutes: 20`, and the suite outgrew that ceiling: on 2026-09-18 (run 1961) it
  # was CANCELLED at 20:00 having reached 63 % — and every master push back to at least 2026-08-04
  # (run 1260) ended red the same way. A gate that cannot pass is a gate nobody reads, so for seven
  # weeks the only evidence a push was sound was a local run. The Windows leg below already shards
  # the same way; `--splits`/`--group` are pytest-split's (a `[dev]` dependency). The Windows leg
  # lives in `tests-windows.yml` since 2026-09-22 (that file says why).
  pytest:
    runs-on: ubuntu-latest
    # BALANCED BY NAME, NOT CUT IN QUARTERS. pytest-split's default (`duration_based_chunks`) with no
    # `.test_durations` cuts the collection into four CONTIGUOUS quarters by count, and the last
    # quarter holds the slow families: locally 1,679 s against 637-740 s for the other three, and on
    # run 1964 group 4 took 25 minutes while groups 1-3 finished in 9-11. `least_duration` with no
    # durations deals the tests out round-robin by name, so the slow families spread: the full suite
    # measured 779 / 901 / 977 / 989 s on 2026-09-22 (a durations file would be ~1.8 MB of churn for
    # the last few percent). It splits a FILE across shards, which is what exposed — and got fixed — a
    # test that rewrote a real source file for the length of a nested pytest; module fixtures run
    # once per shard instead of once. 30 minutes is the old ceiling back, with headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_merge_history_integrity.py scans every merge for the shape that
          # silently deleted two commits (and their guarding tests) from this repo TWICE — a merge
          # whose tree equals one parent's while another parent carries commits it lacks. Under the
          # default shallow fetch there is no history to scan and those tests skip cleanly, i.e. the
          # guard is present and inert, which is the worst of both.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: python -m pytest --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - name: Build production UI
        run: npm run build
        working-directory: ui
      - name: Enforce bundle budgets
        run: npm run check:bundle
        working-directory: ui

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: python -m pip install build
      - run: python -m build
      - name: Prove the sdist builds a wheel without Node dependencies
        run: |
          mkdir clean-dist
          cp dist/*.tar.gz clean-dist/
          python -m pip wheel --no-deps --no-build-isolation clean-dist/*.tar.gz
