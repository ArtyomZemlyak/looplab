[project]
name = "looplab"
version = "0.1.0"
description = "LoopLab — autonomous ML/DS research engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Artyom Zemlyak", email = "artyom.zemlyak@gmail.com" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "orjson>=3.9",
    "anyio>=4.0",
    "typer>=0.12",
    "pyyaml>=6.0",   # human-friendly YAML run configs (input only; snapshots stay canonical JSON)
    # Live LLM transport: OpenAICompatibleClient runs on the openai SDK over an httpx client (reliable
    # per-read timeouts that bound a stalled stream). core.llm imports both, and core.config imports a
    # constant from core.llm, so these back the whole package import — they must be declared here, not
    # in an extra. The import is still GUARDED (see core/llm.py) so a --no-deps/offline install can load
    # the engine for replay without them; only constructing the live client then needs them.
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # FastAPI's TestClient transport.
    "fastapi>=0.110",    # server/assistant tests import TestClient and app helpers directly.
    "uvicorn>=0.27",     # keep the dev test environment aligned with the runnable UI server.
    "pytest-split>=0.10", # deterministic CI shards keep portability gates bounded.
    "ruff>=0.6",          # the BLE001 census only (`[tool.ruff]` below); no style rule is enabled.
]
# Documentation site (MkDocs + Material). `mkdocs serve` for a live preview; CI builds & deploys it.
docs = ["mkdocs-material>=9.5,<10", "pymdown-extensions>=10"]
proc = ["psutil>=5.9"]
# Live React UI server (ADR-18: a separate read/control process, never imported by the engine).
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
# Run LoopLab as an auto-launched, proxied app INSIDE a JupyterHub single-user server. Pulls
# jupyter-server-proxy (so the entry point below registers a Launcher tile + auto-launches the UI on
# a free port) and psutil (the reliable cross-platform process-tree kill for spawned engines/evals).
jupyterhub = ["jupyter-server-proxy>=4.1", "fastapi>=0.110", "uvicorn>=0.27", "psutil>=5.9"]
# Real OpenTelemetry export. Without these, tracing still works fully into spans.jsonl
# (files-as-truth, zero-dep); installing them + setting OTEL_* env sends the SAME spans to any
# OTLP collector (Jaeger / Tempo / Honeycomb / …) with no code change.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

[project.scripts]
looplab = "looplab.cli:app"
LoopLab = "looplab.cli:app"   # backwards-compatible alias

# jupyter-server-proxy discovers LoopLab here: with `pip install looplab[jupyterhub]` in a JH
# single-user server, the UI gets a Launcher tile that auto-launches it on a free port and proxies
# it at /user/<name>/proxy/<port>/ — no terminal, no hand-typed URL. See looplab/serve/jupyter.py.
[project.entry-points."jupyter_serverproxy_servers"]
looplab = "looplab.serve.jupyter:setup_looplab"

[build-system]
requires = ["setuptools>=75", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["looplab*"]

[tool.setuptools.package-data]
looplab = [
    "serve/*.json",
    "serve/ui_dist/*",
    "serve/ui_dist/assets/*",
    "serve/ui_dist/.vite/*",
]

# The ONE lint rule this tree runs, and it is a CENSUS rather than a style: `BLE001` (a blind
# `except Exception` / `except BaseException` / bare `except`) — doc 52 row 14 / doc 50 XP-03.
# 675 such handlers exist under `looplab/` and containment is the house style, so the rule is not
# "do not write one"; it is "every one carries `# noqa: BLE001 — <why this is safe to contain>`",
# which turns the annotations from cargo into a reviewed allow-list. `tests/test_containment_census.py`
# re-derives the same census by AST (no `ruff` needed to run the suite) and refuses a new blind
# handler that states no reason; `python -m ruff check looplab` is the command-line twin.
# No formatter and no other rule: "match the style of surrounding code" (CLAUDE.md) stays the rule.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["ui", "runs", "docs", "examples", "build", "dist"]

[tool.ruff.lint]
select = ["BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Selection-only markers (`-m "not live"` / `-m "not docker"`); the module-level skipif gates in
# the test files remain the enforcement — a marked test still auto-skips when its backend is absent.
markers = [
    "live: needs a reachable LLM endpoint (auto-skipped offline)",
    "docker: needs a Docker daemon",
]
